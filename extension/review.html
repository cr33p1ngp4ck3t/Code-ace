<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verifeed post review</title><link rel="stylesheet" href="review.css"><script src="shared/rules.js"></script><script src="shared/writing.js"></script><script type="module" src="review.js"></script></head>
<body>
  <main>
    <p id="status" role="status">Preparing this post…</p>
    <details id="preview" hidden><summary id="preview-title">Selected post</summary><p id="post-text"></p><div id="media-preview"></div></details>
    <section id="scam" aria-labelledby="scam-title" hidden><span class="eyebrow" id="scam-title">SCAM WARNING SIGNS</span><h1 id="risk-title"></h1><div id="reasons"></div><p id="action"></p></section>
    <section id="writing" aria-labelledby="writing-title" hidden><span class="eyebrow" id="writing-title">AI WRITING & QUALITY</span><h2 id="writing-result"></h2><div id="writing-signals"></div><p id="writing-note" class="note"></p></section>
    <div id="coverage" class="note"></div>
    <details id="observations" hidden><summary>Media evidence</summary><p></p></details>
    <p id="error" role="alert"></p>
    <div class="actions"><button id="analyze" class="primary" disabled>Analyze with AI</button><button id="listen" hidden>Listen</button><button id="flag" hidden>Flag</button></div>
    <label class="upload" id="upload-label" hidden><span>Include a file</span><input id="file" type="file" accept="image/jpeg,image/png,image/webp,audio/*,video/*"></label>
    <p id="consent" class="note">Only Analyze with AI sends this selected content to Groq.</p>
    <p id="dismiss-note" class="note">This review stays open until you press ×.</p>
  </main>
</body></html>
